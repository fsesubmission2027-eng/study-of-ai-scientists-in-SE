# Per-run ResearchClaw config for ai_scientist_benchmark tasks.
# The integration script fills llm.base_url / primary_model and writes this
# beside each run under workspace/researchclaw_<timestamp>/config.arc.yaml.

project:
  name: "ai-scientist-benchmark"
  mode: "full-auto"

research:
  topic: "PLACEHOLDER"
  domains:
    - "software-engineering"
  daily_paper_count: 0
  quality_threshold: 3.5
  graceful_degradation: true

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 1
  approval_timeout_hours: 24
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: false
  on_stage_fail: true
  on_gate_required: false

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "openai-compatible"
  base_url: "https://api-sg.umodelverse.ai/v1"
  wire_api: "chat_completions"
  api_key_env: "OPENAI_API_KEY"
  api_key: ""
  primary_model: "deepseek-v4-pro-0813"
  fallback_models:
    - "deepseek-v4-pro-0813"
  s2_api_key: ""
  timeout_sec: 600

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: true

experiment:
  mode: "docker"
  time_budget_sec: 3600
  max_iterations: 10
  metric_key: "primary_metric"
  metric_direction: "maximize"
  sandbox:
    python_path: "~/arc_env/bin/python3"
    gpu_required: false
    max_memory_mb: 8192
  docker:
    image: "researchclaw/benchmark:latest"
    gpu_enabled: false
    memory_limit_mb: 8192
    network_policy: "setup_only"
    auto_install_deps: true
    shm_size_mb: 2048
    keep_containers: false
  opencode:
    enabled: false
    auto: false
  figure_agent:
    enabled: true
    min_figures: 2
    max_figures: 6
    max_iterations: 2
    render_timeout_sec: 60
    docker_image: "researchclaw/benchmark:latest"
    output_format: "python"
    nano_banana_enabled: false
    strict_mode: false
    dpi: 200

prompts:
  # Filled per-run by run_researchclaw_task.py from researchclaw_prompt_pack:
  #   custom_file  → overrides blocks.dataset_guidance (mounted corpora)
  #   extra_prompts → stage-specific Background / policy / dataset hard rules
  custom_file: ""
  extra_prompts: {}

metaclaw_bridge:
  enabled: false
