# Copy to benchmark_credentials.yaml (same directory) and fill in secrets.
# Path override: export BENCHMARK_CREDENTIALS_FILE=/path/to/benchmark_credentials.yaml
#
# Priority: shell environment variables > this file > legacy ~/AI-Scientist-v2/.env
#            > legacy ~/AI-Researcher/.env (airesearcher keys only)
#
# Initialize from legacy .env files:
#   python3 integrations/benchmark_credentials.py --init

llm:
  api_key: ""
  base_url: "https://api-sg.umodelverse.ai/v1"
  # EvoScientist provider id (custom-openai | openai)
  provider: "custom-openai"

semantic_scholar:
  api_key: ""

github:
  # ResearchClaw uses GITHUB_TOKEN; AI-Researcher uses GITHUB_AI_TOKEN (both set from here)
  token: ""

kaggle:
  # Modern Kaggle API token from https://www.kaggle.com/settings/api (KGAT_...)
  # Applied as KAGGLE_API_TOKEN; also store in ~/.kaggle/access_token
  api_token: ""

openrouter:
  api_key: ""
  base_url: "https://openrouter.ai/api/v1"

paperreview:
  # Used by evaluation/run_evaluate.py --auto-paperreview
  email: ""
  # Optional default venue (ICLR shows 1-10 overall score on paperreview.ai)
  venue: "ICLR"

models:
  # Shared default when a tool-specific model is omitted
  default: "deepseek-v4-pro-0813"

  evoscientist: "openai/gpt-5-mini"
  # ResearchClaw → umodelverse: use exact id from /v1/models (e.g. openai/gpt-5-mini)
  researchclaw: "openai/gpt-5-mini"
  researchclaw_fallback:
    - "openai/gpt-5-mini"
  deepscientist: "modelverse/deepseek-v4-pro-0813"
  tinyscientist: "openai/deepseek-v4-pro-0813"

  aiscientist_code: "deepseek-v4-pro-0813"
  aiscientist_feedback: "deepseek-ai/DeepSeek-V3.2-Exp"
  aiscientist_vlm: "gpt-4o-mini"

  aris_executor: "deepseek-v4-pro-0813"
  aris_reviewer: "deepseek-v4-pro-0813"

  airesearcher: "openai/deepseek-v4-pro-0813"
  airesearcher_cheap: "openai/deepseek-v4-pro-0813"
